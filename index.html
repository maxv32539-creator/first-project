<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI/CD Test</title>

    <style>
        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#2563eb;
            font-family:Arial,sans-serif;
            color:white;
        }

        .box{
            background:white;
            color:#2563eb;
            padding:40px 60px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 10px 25px rgba(0,0,0,.2);
        }

        h1{
            margin-bottom:10px;
        }

        p{
            margin:0;
            font-size:18px;
        }
    </style>

</head>
<body>

<div class="box">
    <h1>🎉 CI/CD is Working!</h1>
    <p>Deployment Successful</p>
    <p><strong>Version 1.0</strong></p>
</div>

</body>
</html>
